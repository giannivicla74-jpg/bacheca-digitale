<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="viclaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b5c"/>
      <stop offset="100%" stop-color="#071736"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
  </defs>
  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="100" fill="url(#viclaGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>

  <!-- Logo Icon: Stylized Building / Board with safety helmet & digital pulse -->
  <g transform="translate(96, 96)">
    <!-- Clipboard / Tablet Screen -->
    <rect x="30" y="50" width="260" height="310" rx="24" fill="#ffffff" fill-opacity="0.08" stroke="#ffffff" stroke-width="8"/>
    <!-- Top Clip with Orange Accent -->
    <rect x="100" y="30" width="120" height="36" rx="12" fill="url(#orangeGrad)"/>
    <circle cx="160" cy="48" r="8" fill="#ffffff"/>

    <!-- Document Lines -->
    <rect x="60" y="120" width="140" height="12" rx="6" fill="#38bdf8"/>
    <rect x="60" y="150" width="200" height="10" rx="5" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="60" y="180" width="170" height="10" rx="5" fill="#ffffff" fill-opacity="0.6"/>
    <rect x="60" y="210" width="190" height="10" rx="5" fill="#ffffff" fill-opacity="0.6"/>

    <!-- Checkmark Badge in Orange -->
    <circle cx="230" cy="280" r="48" fill="url(#orangeGrad)" stroke="#0f2b5c" stroke-width="8"/>
    <path d="M214 280 L226 292 L248 266" fill="none" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Vi.Cla. Text Banner at Bottom -->
  <text x="256" y="455" font-family="'Inter', -apple-system, sans-serif" font-size="34" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="4">
    VI.CLA. PORTALE
  </text>
</svg>
